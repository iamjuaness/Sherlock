<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sherlock – Panel de Administración</title>
    <meta name="description" content="Panel de administración, auditoría de picks, estadísticas y explorador de base de datos para Sherlock." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
      :root {
        --dash-glow: rgba(99, 102, 241, 0.15);
        --admin-accent: #6366f1;
        --admin-accent-hover: #4f46e5;
        --admin-success: #10b981;
        --admin-danger: #ef4444;
        --admin-warning: #f59e0b;
        --admin-bg-dark: var(--bg-base, #030712);
        --admin-card-bg: var(--bg-elevated, #0b0f19);
        --admin-border: var(--border, rgba(255, 255, 255, 0.08));
      }

      .admin-layout {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg-base, #030712);
        color: var(--text-primary, #f8fafc);
        font-family: 'Inter', sans-serif;
      }

      .admin-header {
        background: var(--bg-elevated, #0b0f19);
        border-bottom: 1px solid var(--admin-border);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        sticky: top;
        z-index: 100;
      }

      .admin-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 1.35rem;
        font-weight: 800;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .admin-nav {
        display: flex;
        gap: 0.5rem;
      }

      .admin-nav-item {
        padding: 0.6rem 1.2rem;
        border-radius: 0.5rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #94a3b8;
        text-decoration: none;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .admin-nav-item:hover, .admin-nav-item.active {
        color: #ffffff;
        background: rgba(99, 102, 241, 0.2);
        border: 1px solid rgba(99, 102, 241, 0.4);
      }

      .admin-content {
        flex: 1;
        padding: 2rem;
        max-width: 1600px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
      }

      /* Global Filters Bar */
      .filters-bar {
        background: var(--admin-card-bg);
        border: 1px solid var(--admin-border);
        border-radius: 0.75rem;
        padding: 1.25rem;
        margin-bottom: 1.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .filter-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .filter-input, .filter-select {
        background: var(--bg-input, #080c15);
        border: 1px solid var(--admin-border);
        border-radius: 0.4rem;
        padding: 0.45rem 0.75rem;
        color: #ffffff;
        font-size: 0.85rem;
        min-width: 140px;
      }

      .filter-input:focus, .filter-select:focus {
        outline: none;
        border-color: var(--admin-accent);
      }

      .btn-admin {
        background: var(--admin-accent);
        color: #ffffff;
        border: none;
        border-radius: 0.4rem;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }

      .btn-admin:hover {
        background: var(--admin-accent-hover);
      }

      .btn-secondary {
        background: #334155;
        color: #f1f5f9;
      }
      .btn-secondary:hover {
        background: #475569;
      }

      /* KPI Cards */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .kpi-card {
        background: var(--admin-card-bg);
        border: 1px solid var(--admin-border);
        border-radius: 0.75rem;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .kpi-title {
        font-size: 0.8rem;
        color: #94a3b8;
        font-weight: 600;
        text-transform: uppercase;
      }

      .kpi-value {
        font-size: 1.85rem;
        font-weight: 800;
        margin: 0.4rem 0;
        color: #f8fafc;
      }

      .kpi-value.positive { color: #34d399; }
      .kpi-value.negative { color: #f87171; }

      .kpi-subtext {
        font-size: 0.75rem;
        color: #64748b;
      }

      /* Admin Tables */
      .table-container {
        background: var(--admin-card-bg);
        border: 1px solid var(--admin-border);
        border-radius: 0.75rem;
        overflow-x: auto;
        margin-bottom: 1.5rem;
      }

      .admin-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        text-align: left;
      }

      .admin-table th {
        background: var(--bg-input, #080c15);
        color: #cbd5e1;
        padding: 0.85rem 1rem;
        font-weight: 600;
        border-bottom: 1px solid var(--admin-border);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      .admin-table th:hover {
        color: #ffffff;
      }

      .admin-table td {
        padding: 0.85rem 1rem;
        border-bottom: 1px solid #334155;
        color: #e2e8f0;
        white-space: nowrap;
      }

      .admin-table tr:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .badge {
        padding: 0.25rem 0.55rem;
        border-radius: 0.35rem;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .badge-won { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
      .badge-lost { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
      .badge-push { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
      .badge-pending { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.4); }

      /* Pagination Footer */
      .pagination-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 0;
        color: #94a3b8;
        font-size: 0.85rem;
      }

      .pagination-controls {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      /* Modal Drawer */
      .modal-backdrop {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(4px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-backdrop.show { display: flex; }

      .modal-content {
        background: #1e293b;
        border: 1px solid var(--admin-border);
        border-radius: 0.75rem;
        max-width: 900px;
        width: 90%;
        max-height: 85vh;
        overflow-y: auto;
        padding: 1.75rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--admin-border);
        padding-bottom: 1rem;
        margin-bottom: 1.25rem;
      }

      .modal-title {
        font-size: 1.2rem;
        font-weight: 700;
      }

      .close-btn {
        background: none;
        border: none;
        color: #94a3b8;
        font-size: 1.5rem;
        cursor: pointer;
      }

      .close-btn:hover { color: #ffffff; }

      /* Grid Charts Layout */
      .charts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }

      .chart-card {
        background: var(--admin-card-bg);
        border: 1px solid var(--admin-border);
        border-radius: 0.75rem;
        padding: 1.25rem;
      }

      .chart-title {
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: #f1f5f9;
      }

      .warning-banner {
        background: rgba(245, 158, 11, 0.15);
        border: 1px solid rgba(245, 158, 11, 0.4);
        color: #fbbf24;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body class="admin-layout">

    <!-- Header Navigation -->
    <header class="admin-header">
      <div class="admin-brand">
        🔍 Sherlock Admin Panel
      </div>
      <nav class="admin-nav">
        <a href="/admin/dashboard" class="admin-nav-item {% if active_tab == 'dashboard' %}active{% endif %}">
          📊 Dashboard
        </a>
        <a href="/admin/picks" class="admin-nav-item {% if active_tab == 'picks' %}active{% endif %}">
          🔎 Explorador de Picks
        </a>
        <a href="/admin/stats" class="admin-nav-item {% if active_tab == 'stats' %}active{% endif %}">
          📈 Estadísticas Avanzadas
        </a>
        <a href="/admin/database" class="admin-nav-item {% if active_tab == 'database' %}active{% endif %}">
          🗄️ Base de Datos
        </a>
      </nav>
      <div>
        <span style="font-size:0.8rem; color:#94a3b8; background:#0f172a; padding:0.4rem 0.8rem; border-radius:0.4rem; border:1px solid #334155;">
          Rol: <strong>Administrador</strong>
        </span>
      </div>
    </header>

    <!-- Main Dynamic Content -->
    <main class="admin-content">
      <div id="admin-view-root" data-active-tab="{{ active_tab }}">
        {% if active_tab == 'dashboard' %}
          {% include 'main_dashboard.html' %}
        {% else %}
          <!-- Tab Content dynamically mounted by admin.js -->
          <div style="text-align: center; padding: 4rem;">
            <p style="color: #94a3b8;">Cargando Sherlock Admin Panel...</p>
          </div>
        {% endif %}
      </div>
    </main>

    <!-- Detail Drawer / Modal -->
    <div id="admin-modal" class="modal-backdrop">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title" class="modal-title">Detalle</h3>
          <button class="close-btn" onclick="closeAdminModal()">&times;</button>
        </div>
        <div id="modal-body">
          <!-- Dynamic Modal Content -->
        </div>
      </div>
    </div>

    <script src="/static/js/dashboard_main.js?v={{ js_version }}"></script>
    <script src="/static/js/admin.js"></script>
  </body>
</html>
