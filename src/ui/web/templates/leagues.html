<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sherlock – Rendimiento por Ligas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/styles.css?v={{ css_version }}" />
    <style>
      :root {
        --lg-card: #111721;
        --lg-card-2: #161d29;
        --lg-line: rgba(148, 163, 184, 0.14);
        --lg-text-3: #6b7a8e;
        --lg-accent: #22d3ee;
        --lg-accent-soft: rgba(34, 211, 238, 0.12);
        --lg-pos: #34d399;
        --lg-neg: #fb7185;
        --lg-warn: #fbbf24;
        --lg-ring: 0 0 0 1px rgba(148, 163, 184, 0.14),
          0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px -12px rgba(0, 0, 0, 0.55);
      }
      .leagues-container {
        max-width: 1750px;
        margin: 0 auto;
        padding: 1.5rem 1.5rem 2rem;
        font-variant-numeric: tabular-nums;
      }
      .leagues-layout {
        display: grid;
        grid-template-columns: 400px minmax(0, 1fr);
        gap: 1.25rem;
        align-items: start;
      }
      @media (max-width: 900px) {
        .leagues-layout { grid-template-columns: minmax(0, 1fr); }
        .sidebar-card { position: static !important; max-height: none !important; }
      }

      /* Cards */
      .sidebar-card, .detail-header, .match-card {
        background: var(--lg-card);
        border: 1px solid transparent;
        box-shadow: var(--lg-ring);
        border-radius: 16px;
      }
      .sidebar-card {
        padding: 1.125rem;
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        overscroll-behavior: contain;
        position: sticky;
        top: 1rem;
        z-index: 10;
      }
      .sidebar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.875rem; }
      .sidebar-title { font-size: 0.9rem; font-weight: 700; color: var(--text-primary); }
      .lg-check {
        display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none;
        font-size: 0.78rem; font-weight: 500; color: #9aa7b8;
      }
      .lg-check input { width: 15px; height: 15px; accent-color: var(--lg-accent); cursor: pointer; }
      .lg-check--pill {
        font-size: 0.8125rem; font-weight: 600; background: var(--lg-card-2);
        padding: 5px 12px; border-radius: 10px; box-shadow: 0 0 0 1px var(--lg-line);
      }
      .lg-input, #selected-season {
        font: inherit; font-size: 0.82rem; color: var(--text-primary); background: #0a0e14;
        border: 1px solid var(--lg-line); border-radius: 10px; padding: 0.5rem 0.75rem;
        outline: none; color-scheme: dark; transition: border-color 150ms ease-out;
      }
      .lg-input { width: 100%; margin-bottom: 0.75rem; }
      .lg-input:focus-visible, #selected-season:focus-visible { border-color: var(--lg-accent); outline: 2px solid var(--lg-accent); outline-offset: 1px; }
      #matches-list { max-height: calc(100vh - 260px); overflow-y: auto; overscroll-behavior: contain; padding-right: 6px; }

      .league-list-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 0.65rem 0.8rem; border-radius: 10px; cursor: pointer; margin-bottom: 2px;
        border: 1px solid transparent; background: transparent;
        transition-property: background-color, color; transition-duration: 150ms; transition-timing-function: ease-out;
      }
      @media (hover: hover) { .league-list-item:hover { background: rgba(148, 163, 184, 0.07); } }
      .league-list-item--active, .league-list-item--active:hover {
        background: var(--lg-accent-soft); color: var(--lg-accent);
      }
      .league-list-item--pending { box-shadow: inset 3px 0 0 var(--lg-warn); }
      .league-list-item__name {
        font-size: 0.85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; flex: 1; min-width: 0; margin-right: 0.75rem;
      }
      .league-list-item__profit { font-size: 0.82rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; }

      .profit--positive { color: var(--lg-pos); }
      .profit--negative { color: var(--lg-neg); }

      /* Detail */
      .detail-header { padding: 1.25rem; margin-bottom: 1.25rem; }
      .detail-header__title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: #fff; }
      .detail-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
      .detail-top__left { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
      .lg-danger {
        font: inherit; font-size: 0.8rem; font-weight: 600; color: var(--lg-neg); cursor: pointer;
        background: rgba(251, 113, 133, 0.1); border: 1px solid transparent;
        box-shadow: 0 0 0 1px rgba(251, 113, 133, 0.25); border-radius: 10px; padding: 0.45rem 0.85rem;
        transition-property: background-color, scale; transition-duration: 150ms; transition-timing-function: ease-out;
      }
      .lg-danger:active { scale: 0.96; }
      @media (hover: hover) { .lg-danger:hover { background: rgba(251, 113, 133, 0.2); } }
      .league-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
      .league-stat-box {
        background: #0a0e14; padding: 0.75rem 1rem; border-radius: 12px; text-align: left;
        box-shadow: 0 0 0 1px var(--lg-line);
      }
      .league-stat-box__val { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
      .league-stat-box__lbl {
        font-size: 0.7rem; font-weight: 600; color: var(--lg-text-3); text-transform: uppercase;
        margin-top: 0.25rem; letter-spacing: 0.06em;
      }

      .match-card { margin-bottom: 0.875rem; overflow: hidden; }
      .match-card__header {
        padding: 0.875rem 1.125rem; border-bottom: 1px solid var(--lg-line);
        display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;
      }
      .match-card__title { font-weight: 700; font-size: 1rem; }
      .match-card__date { font-size: 0.78rem; color: var(--lg-text-3); }
      .match-card__body { padding: 1.125rem; }
      .pick-row {
        display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0.8rem;
        background: #0a0e14; border-radius: 10px; margin-bottom: 0.4rem;
      }
      .pick-row:last-child { margin-bottom: 0; }
      .badge-success, .badge-fail, .badge-pending, .badge-stats-missing, .badge-void {
        padding: 2px 7px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; border: 1px solid transparent;
      }
      .badge-success { background: rgba(52, 211, 153, 0.14); color: var(--lg-pos); }
      .badge-fail { background: rgba(251, 113, 133, 0.14); color: var(--lg-neg); }
      .badge-pending { background: rgba(251, 191, 36, 0.14); color: var(--lg-warn); }
      .badge-void, .badge-stats-missing { background: rgba(148, 163, 184, 0.14); color: #9aa7b8; }

      .toolbar-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.25rem; }
      .tabs-container {
        display: flex; gap: 0.25rem; padding: 4px; background: var(--lg-card);
        border-radius: 14px; width: fit-content; box-shadow: var(--lg-ring);
      }
      .tab-btn {
        font: inherit; background: transparent; color: #9aa7b8; border: none; padding: 0.5rem 1.1rem;
        border-radius: 10px; font-weight: 600; font-size: 0.8125rem; cursor: pointer;
        transition-property: background-color, color, scale; transition-duration: 150ms; transition-timing-function: ease-out;
      }
      .tab-btn:enabled:active { scale: 0.96; }
      @media (hover: hover) { .tab-btn:hover { color: #fff; background: rgba(148, 163, 184, 0.08); } }
      .tab-btn.active, .tab-btn.active:hover { background: var(--lg-accent-soft); color: var(--lg-accent); }
      .tab-btn:focus-visible { outline: 2px solid var(--lg-accent); outline-offset: 2px; }
      .season-card {
        display: none; align-items: center; gap: 0.5rem; background: var(--lg-card);
        padding: 4px 10px; border-radius: 12px; box-shadow: var(--lg-ring); margin-left: auto;
      }
      .season-card span { font-size: 0.8125rem; font-weight: 600; color: var(--lg-text-3); white-space: nowrap; }

      .dashboard-loader { display: flex; align-items: center; justify-content: center; gap: 0.75rem; height: 360px; color: #9aa7b8; }
      .spinner {
        width: 22px; height: 22px; border: 3px solid rgba(148, 163, 184, 0.2);
        border-top-color: var(--lg-accent); border-radius: 50%; animation: lg-spin 0.8s linear infinite;
      }
      @keyframes lg-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    {% include '_nav.html' %}
    <header class="header">
      <div class="header__brand">
        <span class="header__icon">🏆</span>
        <h1 class="header__title">Sherlock</h1>
        <span class="header__tag">Ligas</span>
      </div>
      <p class="header__subtitle">
        Desglose detallado por competición, partidos y cuotas evaluadas
      </p>
    </header>

    <div class="leagues-container">
      <div id="leagues-loader" class="dashboard-loader">
        <div class="spinner"></div>
        <span>Cargando ligas y estadísticas...</span>
      </div>

      <div id="leagues-content" style="display: none" class="leagues-layout">
        <!-- Columna Izquierda: Lista de Ligas -->
        <div class="sidebar-card">
          <div class="sidebar-head">
            <div class="sidebar-title">Competiciones</div>
            <label class="lg-check">
              <input type="checkbox" id="leagues-use-stake" onchange="toggleLeaguesStake()" />
              📈 Stakes
            </label>
          </div>
          <input
            type="text"
            id="league-search-input"
            class="lg-input"
            placeholder="🔍 Buscar liga..."
            aria-label="Buscar liga"
            oninput="filterLeaguesList()"
          />
          <div id="leagues-list">
            <!-- Rellenado dinámicamente -->
          </div>
        </div>

        <!-- Columna Derecha: Detalles de la Liga seleccionada -->
        <div id="league-detail-section">
          <div class="detail-header">
            <div class="detail-top">
              <div class="detail-top__left">
                <div class="detail-header__title" id="selected-league-name">
                  Selecciona una liga
                </div>
                <label id="league-profit-toggle-card" class="lg-check lg-check--pill">
                  <input type="checkbox" id="chk-league-profitability" onchange="toggleActiveLeagueProfitability(this.checked)" />
                  <span>Contar en Rentabilidad</span>
                </label>
              </div>
              <button id="btn-delete-league" class="lg-danger" onclick="deleteCurrentLeague()">
                🗑️ Eliminar competición
              </button>
            </div>
            <div class="league-stats-grid">
              <div class="league-stat-box">
                <div class="league-stat-box__val" id="lbl-total-matches">0</div>
                <div class="league-stat-box__lbl">Partidos</div>
              </div>
              <div class="league-stat-box">
                <div class="league-stat-box__val" id="lbl-total-picks">0</div>
                <div class="league-stat-box__lbl">Picks</div>
              </div>
              <div class="league-stat-box">
                <div class="league-stat-box__val" id="lbl-accuracy">0%</div>
                <div class="league-stat-box__lbl">Acierto</div>
              </div>
              <div class="league-stat-box">
                <div class="league-stat-box__val">
                  <span id="lbl-profit">0.0 u</span>
                  <span id="lbl-roi" style="font-size: 0.85rem; font-weight: 600; opacity: 0.9; margin-left: 4px;">(+0.0%)</span>
                </div>
                <div class="league-stat-box__lbl">Beneficio (ROI)</div>
              </div>
              <div class="league-stat-box">
                <div class="league-stat-box__val" id="lbl-avg-odds" style="color: #fbbf24;">0.00</div>
                <div class="league-stat-box__lbl">Cuota Media</div>
              </div>
              <div class="league-stat-box">
                <div class="league-stat-box__val" id="lbl-break-even" style="color: #22d3ee;">0.0%</div>
                <div class="league-stat-box__lbl">% Equilibrio</div>
              </div>
            </div>
          </div>

          <div class="toolbar-row">
            <div class="tabs-container">
              <button
                id="tab-matches"
                class="tab-btn active"
                onclick="switchView('matches')"
              >
                Partidos
              </button>
              <button
                id="tab-markets"
                class="tab-btn"
                onclick="switchView('markets')"
              >
                Mercados
              </button>
            </div>

            <div id="markets-bulk-actions" style="display: none; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
              <button
                id="btn-select-markets"
                class="tab-btn"
                onclick="toggleMarketSelectMode()"
                style="background: rgba(99, 102, 241, 0.15); color: var(--accent-light); border: 1px solid var(--accent);"
              >
                ☑️ Seleccionar
              </button>
              <button
                id="btn-select-all-markets"
                class="tab-btn"
                onclick="toggleSelectAllMarkets()"
                style="display: none; background: rgba(255, 255, 255, 0.05); color: var(--text-secondary); border: 1px solid var(--border);"
              >
                Seleccionar Todos
              </button>
              <button
                id="btn-apply-bulk-block"
                class="tab-btn"
                onclick="applyBulkGovernance('block')"
                style="display: none; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); opacity: 0.6; cursor: not-allowed;"
                disabled
              >
                🚫 Bloquear Seleccionados (0)
              </button>
              <button
                id="btn-apply-bulk-reduce"
                class="tab-btn"
                onclick="applyBulkGovernance('reduce')"
                style="display: none; background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); opacity: 0.6; cursor: not-allowed;"
                disabled
              >
                📉 Reducir Stake (0)
              </button>
            </div>

            <!-- Filtro de Temporadas de la Liga -->
            <div id="season-filter-card" class="season-card">
              <span>📅 Temporada:</span>
              <select id="selected-season" aria-label="Temporada" onchange="changeSelectedSeason()">
                <option value="all">Todas las temporadas</option>
              </select>
            </div>
          </div>

          <div id="matches-list">
            <!-- Rellenado dinámicamente con partidos y sus picks o mercados -->
          </div>
        </div>
      </div>
    </div>

    <script src="/static/js/leagues.js?v={{ js_version }}"></script>
  </body>
</html>
